<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <a href="../../index.html">← Voltar ao portfólio</a>
      <section class="calculadora">
        <div id="tela" aria-live="polite">0</div>
        <div class="teclas">
          <button data-acao="limpar" class="especial">C</button
          ><button data-acao="apagar" class="especial">⌫</button
          ><button data-valor="%" class="operador">%</button
          ><button data-valor="/" class="operador">÷</button
          ><button data-valor="7">7</button><button data-valor="8">8</button
          ><button data-valor="9">9</button
          ><button data-valor="*" class="operador">×</button
          ><button data-valor="4">4</button><button data-valor="5">5</button
          ><button data-valor="6">6</button
          ><button data-valor="-" class="operador">−</button
          ><button data-valor="1">1</button><button data-valor="2">2</button
          ><button data-valor="3">3</button
          ><button data-valor="+" class="operador">+</button
          ><button data-valor="0" class="zero">0</button
          ><button data-valor=".">,</button
          ><button data-acao="resultado" class="igual">=</button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>

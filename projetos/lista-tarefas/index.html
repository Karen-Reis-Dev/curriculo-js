<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <a href="../../index.html">← Voltar ao portfólio</a>
      <section>
        <p class="rotulo">PROJETO 02</p>
        <h1>Lista de tarefas</h1>
        <form id="form-tarefa">
          <input
            id="nova-tarefa"
            placeholder="O que você precisa fazer?"
            required
          /><button>Adicionar</button>
        </form>
        <div id="filtros">
          <button class="ativo" data-filtro="todas">Todas</button
          ><button data-filtro="pendentes">Pendentes</button
          ><button data-filtro="concluidas">Concluídas</button>
        </div>
        <ul id="lista"></ul>
        <p id="contador"></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
